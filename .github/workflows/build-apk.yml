name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Android project (amake)
        run: |
          cd paint
          ../base/make --target android

      - name: Restore gradle-wrapper.jar (amake corrupts binary copies)
        run: cp base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.jar paint/build/ArmorPaint/gradle/wrapper/gradle-wrapper.jar

      - name: Install CMake 3.22.1 + patch generated gradle (template pins local-only 4.0.2)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" > /dev/null
          sed -i 's/version = "4.0.2"/version = "3.22.1"/' paint/build/ArmorPaint/app/build.gradle.kts

      - name: Build APK (debug, installable)
        run: |
          cd paint/build/ArmorPaint
          bash gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-android-arm64
          path: paint/build/ArmorPaint/app/build/outputs/apk/debug/app-debug.apk
